<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zoho CRM DevTools</title>
    <script type="module" src="./main.ts"></script>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main class="popup">
      <div class="pad">
        <header class="hd">
          <img src="/icons/icon-48.png" alt="" width="34" height="34" />
          <div class="hcol">
            <h1>Zoho CRM DevTools</h1>
            <p id="page-status" class="pill off"><i></i><span id="page-status-text">Checking page...</span></p>
          </div>
        </header>
        <label class="en">
          <span class="x">
            <b>Enabled</b>
            <span id="extension-enabled-desc">Editor themes, search and export on Zoho CRM pages</span>
          </span>
          <input id="extension-enabled" class="sw" type="checkbox" role="switch" aria-checked="false" aria-label="Enabled" aria-describedby="extension-enabled-desc" />
        </label>
        <section data-notice aria-label="Notice"></section>
      </div>
      <section data-account aria-label="Account"></section>
    </main>
  </body>
</html>
